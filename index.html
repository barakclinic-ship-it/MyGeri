<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MyGeri v1.2 — מעקב מסלול בעיטות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#121212;
    --ink-2:#1c1c1a;
    --paper:#EDE7DA;
    --paper-2:#E2DBC9;
    --indigo:#2B3A67;
    --indigo-l:#5169A8;
    --vermilion:#B23A2E;
    --gold:#C9A227;
    --muted:#8B8B85;
    --line:rgba(237,231,218,0.14);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--ink);color:var(--paper);
    font-family:'Heebo',sans-serif; overflow:hidden;}
  .mono{font-family:'JetBrains Mono',monospace;}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;}

  /* ---------- Top bar ---------- */
  #topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px; z-index:20; position:relative;
  }
  #stateLabel{
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.18em;
    text-transform:uppercase; color:var(--muted);
    border:1px solid var(--line); border-radius:20px; padding:5px 14px;
  }
  #stateLabel.active{color:var(--ink); background:var(--gold); border-color:var(--gold);}
  #stateLabel.rec{color:var(--paper); background:var(--vermilion); border-color:var(--vermilion);}
  #camSwitch{
    position:absolute; bottom:18px; right:18px;
    width:68px; height:68px; border-radius:50%;
    background:rgba(18,18,18,0.32); backdrop-filter:blur(6px);
    border:2px solid rgba(255,255,255,0.75);
    display:flex; align-items:center; justify-content:center;
    z-index:12; transition:opacity .2s;
  }
  #camSwitch svg{ width:32px; height:32px; }
  #camSwitch:disabled, #camSwitch.hidden{ opacity:0; pointer-events:none; }

  /* ---------- Camera stage ---------- */
  #stage{position:relative; flex:1; overflow:hidden; background:#000;}
  #video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  #video.mirrored{transform:scaleX(-1);}
  #overlay{position:absolute; inset:0; width:100%; height:100%;}
  #recBorder{position:absolute; inset:0; pointer-events:none; border:0px solid var(--vermilion); transition:border-width .25s;}
  #recBorder.on{border-width:4px; animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.45;}}

  #hint{
    position:absolute; left:50%; bottom:26px; transform:translateX(-50%);
    background:rgba(18,18,18,0.78); backdrop-filter:blur(6px);
    padding:10px 20px; border-radius:14px; font-size:15px; text-align:center;
    border:1px solid var(--line); max-width:88%;
  }
  #hint.good{color:var(--gold); border-color:var(--gold);}

  #countdown{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono',monospace; font-weight:600; font-size:min(38vw,220px);
    color:var(--paper); text-shadow:0 0 40px rgba(0,0,0,.6); pointer-events:none; opacity:0;
  }
  #countdown.show{opacity:1;}

  #timer{
    position:absolute; bottom:18px; right:18px; font-size:14px; color:var(--paper);
    background:rgba(178,58,46,0.85); padding:6px 12px; border-radius:10px; opacity:0;
  }
  #timer.on{opacity:1;}

  #stopBtn{
    position:absolute; top:18px; left:18px; background:rgba(18,18,18,.7);
    border:1px solid var(--line); color:var(--paper); font-family:'Heebo';
    font-size:13px; padding:8px 16px; border-radius:12px; opacity:0; pointer-events:none;
  }
  #stopBtn.on{opacity:1; pointer-events:auto;}

  #micNote{position:absolute; top:60px; left:18px; font-size:11px; color:var(--muted); max-width:150px; opacity:0;}
  #micNote.on{opacity:1;}

  #liveTranscript{
    position:absolute; bottom:52px; left:50%; transform:translateX(-50%);
    font-size:12px; color:rgba(237,231,218,0.55); max-width:80%; text-align:center;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:0; transition:opacity .15s;
  }
  #liveTranscript.on{opacity:1;}

  #stopFlash{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:44px; font-weight:800; color:var(--paper); background:rgba(178,58,46,0.55);
    opacity:0; pointer-events:none; z-index:25; transition:opacity .1s;
  }
  #stopFlash.show{opacity:1;}

  #camError{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    flex-direction:column; gap:14px; background:var(--ink); z-index:15; padding:30px; text-align:center;
  }
  #camError.show{display:flex;}
  #camError p{color:var(--muted); font-size:13px; max-width:280px; line-height:1.7;}
  #camError button{background:var(--indigo); color:var(--paper); border:none; border-radius:24px;
    padding:12px 28px; font-family:'Heebo'; font-size:15px; font-weight:600;}

  #toast{
    position:absolute; left:50%; top:70px; transform:translateX(-50%);
    background:rgba(18,18,18,0.85); color:var(--paper); font-size:13px;
    padding:9px 18px; border-radius:14px; z-index:22; opacity:0; transition:opacity .25s;
    max-width:80%; text-align:center;
  }
  #toast.show{opacity:1;}

  /* ---------- Results ---------- */
  #results{
    position:fixed; inset:0; background:var(--paper); color:var(--ink);
    display:flex; flex-direction:column; transform:translateY(100%);
    transition:transform .4s cubic-bezier(.16,1,.3,1); z-index:30; overflow-y:auto;
  }
  #results.show{transform:translateY(0);}
  .rHead{display:flex; align-items:center; justify-content:space-between; padding:18px 20px 6px;}
  .rHead h1{font-size:20px; margin:0; font-weight:800;}
  .rHead .sub{font-size:12px; color:var(--ink); opacity:.55; margin-top:2px;}
  #closeResults{background:none;border:1px solid rgba(18,18,18,.2); color:var(--ink);
    border-radius:10px; padding:7px 14px; font-family:'Heebo'; font-size:13px;}

  #trajWrap{padding:6px 16px 4px;}
  #trajCanvas{width:100%; height:auto; background:var(--paper-2); border-radius:16px; display:block;}

  #jointLegend{display:flex; justify-content:center; gap:8px; padding:10px 16px 2px; flex-wrap:wrap;}
  .jointChip{
    display:flex; align-items:center; gap:6px; background:none;
    border:1.5px solid rgba(18,18,18,0.15); border-radius:20px; padding:7px 14px;
    font-family:'Heebo'; font-size:13px; color:var(--ink); opacity:1; transition:opacity .15s, border-color .15s;
  }
  .jointChip .dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
  .jointChip.off{opacity:.35;}

  #stats{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:rgba(18,18,18,.1);
    margin:18px 16px; border-radius:14px; overflow:hidden;}
  .stat{background:var(--paper); padding:14px 16px;}
  .stat .v{font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:600;}
  .stat .u{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted); margin-right:4px;}
  .stat .l{font-size:12px; color:var(--muted); margin-top:2px;}

  #norm{margin:0 16px 24px; padding:12px 14px; border:1px dashed rgba(18,18,18,.25); border-radius:12px; font-size:12px; color:var(--muted); line-height:1.6;}

  #retryBtn{
    margin:0 16px 30px; background:none; border:1px solid rgba(18,18,18,.3); color:var(--ink);
    border-radius:24px; padding:12px; font-family:'Heebo'; font-size:14px; font-weight:600;
  }

  #permOverlay{position:fixed; inset:0; background:var(--ink); display:flex; align-items:center;
    justify-content:center; flex-direction:column; gap:16px; z-index:50; padding:30px; text-align:center;}
  #permOverlay button{background:var(--indigo); color:var(--paper); border:none; border-radius:24px;
    padding:14px 24px; font-family:'Heebo'; font-size:15px; font-weight:600;}

  #permOverlay p{color:var(--muted); font-size:14px; max-width:300px; line-height:1.7;}
  #permOverlay h1{font-size:22px; margin:0; font-weight:800;}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <span id="stateLabel" class="mono">כיול</span>
  </div>

  <div id="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
    <div id="recBorder"></div>
    <div id="countdown" class="mono">3</div>
    <div id="hint">מחפש מיקום...</div>
    <div id="timer" class="mono">0.0s</div>
    <button id="stopBtn">✋ עצור</button>
    <div id="micNote"></div>
    <div id="liveTranscript" class="mono"></div>
    <div id="stopFlash">⏹ עצירה</div>
    <div id="toast"></div>
    <button id="camSwitch" title="החלף מצלמה" aria-label="החלף מצלמה">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 2l3 3-3 3"/>
        <path d="M20 5H9a5 5 0 0 0-5 5"/>
        <path d="M7 22l-3-3 3-3"/>
        <path d="M4 19h11a5 5 0 0 0 5-5"/>
      </svg>
    </button>
    <div id="camError">
      <h1 style="font-size:18px;margin:0;">המצלמה לא הופעלה</h1>
      <p id="camErrorMsg">לא הצלחנו להריץ את הווידאו.</p>
      <button id="tapToPlay">הקש להפעלה</button>
    </div>
  </div>
</div>

<div id="results">
  <div class="rHead">
    <div>
      <h1>מסלול הבעיטה</h1>
      <div class="sub" id="legUsed">רגל בועטת: —</div>
    </div>
    <button id="closeResults">חדש</button>
  </div>
  <div id="trajWrap"><canvas id="trajCanvas"></canvas></div>
  <div id="jointLegend"></div>
  <div id="stats"></div>
  <div id="norm"></div>
  <button id="retryBtn">בעיטה נוספת</button>
</div>

<div id="permOverlay">
  <h1>MyGeri <span class="mono" style="font-size:10px; opacity:.5;">v1.2</span></h1>
  <p style="margin-top:-10px; font-size:15px; color:var(--paper); opacity:.75;">מעקב מסלול בעיטות</p>
  <p>נדרשת גישה למצלמה (לזיהוי שלד) ולמיקרופון (לעצירה קולית ב"עצור"). עמדו בפרופיל למצלמה, במרחק שבו כל הגוף נראה.</p>
  <button id="startBtn">התחל</button>
</div>

<script type="module">
import { PoseLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

// ---------- Landmark indices (BlazePose 33-point) ----------
const L = {
  L_SHOULDER:11, R_SHOULDER:12,
  L_HIP:23, R_HIP:24,
  L_KNEE:25, R_KNEE:26,
  L_ANKLE:27, R_ANKLE:28,
  L_HEEL:29, R_HEEL:30,
  L_FOOT:31, R_FOOT:32
};

const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const octx = overlay.getContext('2d');
const stateLabel = document.getElementById('stateLabel');
const hintEl = document.getElementById('hint');
const countdownEl = document.getElementById('countdown');
const timerEl = document.getElementById('timer');
const recBorder = document.getElementById('recBorder');
const stopBtn = document.getElementById('stopBtn');
const micNote = document.getElementById('micNote');
const liveTranscript = document.getElementById('liveTranscript');
const stopFlash = document.getElementById('stopFlash');
const toastEl = document.getElementById('toast');
function toast(msg, ms){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> toastEl.classList.remove('show'), ms||2200);
}
const permOverlay = document.getElementById('permOverlay');
const startBtn = document.getElementById('startBtn');
const camSwitch = document.getElementById('camSwitch');
const camError = document.getElementById('camError');
const camErrorMsg = document.getElementById('camErrorMsg');
const tapToPlay = document.getElementById('tapToPlay');

let poseLandmarker = null;
let running = false;
let phase = 'idle'; // idle -> calibrate -> countdown -> recording -> results
let facingMode = 'environment'; // 'environment' (back) or 'user' (selfie/front)
let currentStream = null;

// stability tracking for calibration
let stabilityBuffer = [];
let stableSince = null;

// recording state
let frames = [];          // {t, hipY, L:{knee,ankle,heel,foot}, R:{...}}
let recStartTime = 0;
const MAX_RECORD_MS = 25000; // last-resort safety stop; voice "סטופ" / manual button are primary

// speech recognition
let recognition = null;
let recognitionActive = false;

function setState(txt, cls){
  stateLabel.textContent = txt;
  stateLabel.className = 'mono' + (cls ? ' '+cls : '');
}

// ---------- Audio cues (athlete stands side-on and can't see the screen) ----------
let audioCtx = null;
function beep(freq, dur, vol){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.value = freq;
    gain.gain.value = vol ?? 0.28;
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (dur||140)/1000);
    osc.stop(audioCtx.currentTime + (dur||140)/1000 + 0.03);
  }catch(e){}
}
function speak(text){
  try{
    if(!window.speechSynthesis) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'he-IL'; u.rate = 1.05; u.volume = 1;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }catch(e){}
}

function pt(lm, idx, w, h){
  const p = lm[idx];
  return { x: p.x * w, y: p.y * h, v: (p.visibility ?? 1) };
}

function angleDeg(a, b, c){
  // angle at b, between a-b and c-b
  const v1 = {x:a.x-b.x, y:a.y-b.y};
  const v2 = {x:c.x-b.x, y:c.y-b.y};
  const dot = v1.x*v2.x + v1.y*v2.y;
  const m1 = Math.hypot(v1.x,v1.y), m2 = Math.hypot(v2.x,v2.y);
  if(m1===0||m2===0) return 0;
  let cos = dot/(m1*m2);
  cos = Math.max(-1,Math.min(1,cos));
  return Math.acos(cos) * 180/Math.PI;
}

function drawSkeleton(lm, w, h, colorOk, mirrored){
  octx.clearRect(0,0,w,h);
  const idxPairs = [
    [L.L_SHOULDER,L.R_SHOULDER],[L.L_SHOULDER,L.L_HIP],[L.R_SHOULDER,L.R_HIP],
    [L.L_HIP,L.R_HIP],
    [L.L_HIP,L.L_KNEE],[L.L_KNEE,L.L_ANKLE],[L.L_ANKLE,L.L_HEEL],[L.L_ANKLE,L.L_FOOT],[L.L_HEEL,L.L_FOOT],
    [L.R_HIP,L.R_KNEE],[L.R_KNEE,L.R_ANKLE],[L.R_ANKLE,L.R_HEEL],[L.R_ANKLE,L.R_FOOT],[L.R_HEEL,L.R_FOOT]
  ];
  octx.strokeStyle = colorOk ? '#C9A227' : 'rgba(237,231,218,0.55)';
  octx.lineWidth = 3;
  octx.lineCap = 'round';
  // mirror x to match the video element's own mirroring (only when facing 'user'/selfie)
  octx.save();
  if(mirrored){ octx.translate(w,0); octx.scale(-1,1); }
  idxPairs.forEach(([a,b])=>{
    const pa = pt(lm,a,w,h), pb = pt(lm,b,w,h);
    if(pa.v<0.4||pb.v<0.4) return;
    octx.beginPath(); octx.moveTo(pa.x,pa.y); octx.lineTo(pb.x,pb.y); octx.stroke();
  });
  [L.L_HIP,L.R_HIP,L.L_KNEE,L.R_KNEE,L.L_ANKLE,L.R_ANKLE,L.L_HEEL,L.R_HEEL,L.L_FOOT,L.R_FOOT].forEach(i=>{
    const p = pt(lm,i,w,h);
    if(p.v<0.4) return;
    octx.beginPath(); octx.arc(p.x,p.y,4,0,7); octx.fillStyle = colorOk?'#C9A227':'#EDE7DA'; octx.fill();
  });
  octx.restore();
}

function resizeCanvas(){
  overlay.width = video.videoWidth || overlay.clientWidth;
  overlay.height = video.videoHeight || overlay.clientHeight;
}

// ---------- Calibration logic ----------
function evaluateCalibration(lm, w, h){
  const lHip = pt(lm,L.L_HIP,w,h), rHip = pt(lm,L.R_HIP,w,h);
  const lAnkle = pt(lm,L.L_ANKLE,w,h), rAnkle = pt(lm,L.R_ANKLE,w,h);
  const lSh = pt(lm,L.L_SHOULDER,w,h), rSh = pt(lm,L.R_SHOULDER,w,h);
  if(Math.min(lHip.v,rHip.v,lAnkle.v,rAnkle.v) < 0.5){
    return {ok:false, msg:'לא רואה את כל הגוף — התרחק/ו קצת'};
  }
  const hipY = (lHip.y+rHip.y)/2;
  const ankleY = (lAnkle.y+rAnkle.y)/2;
  const legPx = Math.abs(ankleY-hipY);
  const ratio = legPx / h;

  const shoulderW = Math.abs(lSh.x-rSh.x);
  const profileRatio = shoulderW / (legPx||1);

  if(ratio < 0.30) return {ok:false, msg:'התקרבו למצלמה'};
  if(ratio > 0.62) return {ok:false, msg:'התרחקו מהמצלמה'};
  if(profileRatio > 0.42) return {ok:false, msg:'הסתובבו לעמידת פרופיל (צד למצלמה)'};

  return {ok:true, msg:'מעולה — נשארו כך', hipY, legPx};
}

function onCalibrationTick(ok){
  const now = performance.now();
  stabilityBuffer.push({t:now, ok});
  stabilityBuffer = stabilityBuffer.filter(s => now - s.t < 900);
  const allOk = stabilityBuffer.length > 10 && stabilityBuffer.every(s=>s.ok);
  if(allOk && stableSince===null) stableSince = now;
  if(!allOk) stableSince = null;
  if(stableSince && now-stableSince > 600){
    startCountdown();
  }
}

function startCountdown(){
  phase = 'countdown';
  updateCamSwitchVisibility();
  setState('הכן', 'active');
  hintEl.style.display='none';
  let idx = 0;
  countdownEl.textContent = 3;
  countdownEl.classList.add('show');
  beep(700,130);
  const iv = setInterval(()=>{
    idx++;
    if(idx >= 3){
      clearInterval(iv);
      countdownEl.classList.remove('show');
      beep(1000,220,0.32);
      startRecording();
      return;
    }
    countdownEl.textContent = 3-idx;
    beep(700,130);
  }, 900);
}

// ---------- Recording ----------
function startRecording(){
  phase = 'recording';
  updateCamSwitchVisibility();
  setState('מקליט', 'rec');
  frames = [];
  recStartTime = performance.now();
  recBorder.classList.add('on');
  timerEl.classList.add('on');
  stopBtn.classList.add('on');
  startRecognitionForRecording();
}

function recordFrame(lm, w, h){
  const t = performance.now() - recStartTime;
  timerEl.textContent = (t/1000).toFixed(1)+'s';

  const hipL = pt(lm,L.L_HIP,w,h), hipR = pt(lm,L.R_HIP,w,h);
  const kneeL = pt(lm,L.L_KNEE,w,h), kneeR = pt(lm,L.R_KNEE,w,h);
  const ankleL = pt(lm,L.L_ANKLE,w,h), ankleR = pt(lm,L.R_ANKLE,w,h);
  const heelL = pt(lm,L.L_HEEL,w,h), heelR = pt(lm,L.R_HEEL,w,h);
  const footL = pt(lm,L.L_FOOT,w,h), footR = pt(lm,L.R_FOOT,w,h);

  frames.push({
    t,
    hip:{x:(hipL.x+hipR.x)/2, y:(hipL.y+hipR.y)/2},
    L:{knee:kneeL, ankle:ankleL, heel:heelL, foot:footL},
    R:{knee:kneeR, ankle:ankleR, heel:heelR, foot:footR}
  });

  // Stopping is voice-driven ("סטופ") or manual — no eager motion-based auto-stop,
  // since it was cutting kicks short. This safety timeout is only a last resort.
  if(t > MAX_RECORD_MS){
    stopRecording('timeout');
  }
}

function stopRecording(reason){
  if(phase !== 'recording') return;
  phase = 'results';
  updateCamSwitchVisibility();
  recBorder.classList.remove('on');
  timerEl.classList.remove('on');
  stopBtn.classList.remove('on');
  micNote.classList.remove('on');
  liveTranscript.classList.remove('on');
  liveTranscript.textContent = '';
  stopRecognition();
  beep(320,220,0.25);
  stopFlash.classList.add('show');
  setTimeout(()=> stopFlash.classList.remove('show'), 500);
  setState('תוצאות');
  showResults();
}

// ---------- Speech recognition (only active during the recording window — releases the mic
// between kicks so it doesn't monopolize it for other apps/tabs) ----------
function startRecognitionForRecording(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    micNote.textContent = 'עצירה קולית לא נתמכת בדפדפן זה — השתמשו בכפתור';
    micNote.classList.add('on');
    return;
  }
  try{
    recognition = new SR();
    recognition.lang = 'he-IL';
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.onresult = (e)=>{
      let lastTxt = '';
      for(let i=e.resultIndex;i<e.results.length;i++){
        lastTxt = e.results[i][0].transcript.trim();
      }
      if(lastTxt){
        liveTranscript.textContent = '🎙 ' + lastTxt;
        liveTranscript.classList.add('on');
      }
      for(let i=e.resultIndex;i<e.results.length;i++){
        const txt = e.results[i][0].transcript.trim();
        if(/עצור|עצרי|עצרו|סטופ|stop|סיים|סיימתי|^די$/i.test(txt)){
          stopRecording('voice');
          break;
        }
      }
    };
    recognition.onerror = (e)=>{
      if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
        micNote.textContent = 'הרשאת מיקרופון נדחתה — השתמשו בכפתור לעצירה';
        micNote.classList.add('on');
      }
      // 'no-speech' / 'aborted' and similar are routine — onend will restart it while still recording
    };
    recognition.onend = ()=>{
      if(recognitionActive && phase==='recording'){ try{ recognition.start(); }catch(e){} }
    };
    recognition.start();
    recognitionActive = true;
    micNote.textContent = '🎙 אמרו "סטופ" לסיום ההקלטה';
    micNote.classList.add('on');
  }catch(e){
    micNote.textContent = 'עצירה קולית לא זמינה — השתמשו בכפתור';
    micNote.classList.add('on');
  }
}
function stopRecognition(){
  recognitionActive = false;
  if(recognition){ try{ recognition.stop(); }catch(e){} recognition = null; }
}

stopBtn.addEventListener('click', ()=> stopRecording('manual'));

// ---------- Results ----------
function chooseKickingLeg(){
  const rangeOf = side => {
    let min=Infinity,max=-Infinity;
    frames.forEach(f=>{ const y=f[side].foot.y; if(y<min)min=y; if(y>max)max=y; });
    return max-min;
  };
  const rL = rangeOf('L'), rR = rangeOf('R');
  return rR > rL ? 'R' : 'L';
}

function smooth(arr, win=3){
  const out=[];
  for(let i=0;i<arr.length;i++){
    let s=0,c=0;
    for(let k=-Math.floor(win/2); k<=Math.floor(win/2); k++){
      const idx=i+k;
      if(idx>=0&&idx<arr.length){ s+=arr[idx]; c++; }
    }
    out.push(s/c);
  }
  return out;
}

const JOINT_COLORS = {
  hip:  '#5A5A54', // muted ink — pelvis reference
  knee: '#2B3A67', // indigo
  ankle:'#B23A2E', // vermilion
  foot: '#C9A227'  // gold
};
const JOINT_LABELS = { hip:'אגן', knee:'ברך', ankle:'קרסול', foot:'כף רגל' };
const JOINT_ORDER = ['hip','knee','ankle','foot'];
let lastResultData = null;
let visibleJoints = { hip:true, knee:true, ankle:true, foot:true };

function showResults(){
  document.getElementById('results').classList.add('show');
  if(frames.length < 6){
    document.getElementById('legUsed').textContent = 'לא נאספו מספיק נתונים — נסו שוב, ודאו שכל הגוף נראה';
    document.getElementById('stats').innerHTML='';
    document.getElementById('trajWrap').style.display='none';
    return;
  }
  document.getElementById('trajWrap').style.display='';

  const side = chooseKickingLeg();
  document.getElementById('legUsed').textContent = 'רגל בועטת: ' + (side==='L'?'שמאל':'ימין');

  const raw = {
    hip:   { x: frames.map(f=>f.hip.x),        y: frames.map(f=>f.hip.y) },
    knee:  { x: frames.map(f=>f[side].knee.x),  y: frames.map(f=>f[side].knee.y) },
    ankle: { x: frames.map(f=>f[side].ankle.x), y: frames.map(f=>f[side].ankle.y) },
    foot:  { x: frames.map(f=>f[side].foot.x),  y: frames.map(f=>f[side].foot.y) },
  };
  const jd = {}; // smoothed joint data
  Object.keys(raw).forEach(k=> jd[k] = { x: smooth(raw[k].x), y: smooth(raw[k].y) });
  const ts = frames.map(f=>f.t);
  const totalMs = ts[ts.length-1];

  // normalization unit: standing leg length at start (hip to ankle)
  const unitPx = Math.hypot(
    frames[0].hip.x - frames[0][side].ankle.x,
    frames[0].hip.y - frames[0][side].ankle.y
  ) || 1;

  // peak speed (px/s) of the kicking foot
  let peakSpeed = 0;
  for(let i=1;i<jd.foot.x.length;i++){
    const dt = (ts[i]-ts[i-1])/1000;
    if(dt<=0) continue;
    const d = Math.hypot(jd.foot.x[i]-jd.foot.x[i-1], jd.foot.y[i]-jd.foot.y[i-1]);
    peakSpeed = Math.max(peakSpeed, d/dt);
  }

  // max knee extension angle (hip-knee-ankle) — track which frame it happens at
  let maxKneeAngle = 0, peakExtIdx = 0;
  frames.forEach((f,i)=>{
    const a = angleDeg(f.hip, f[side].knee, f[side].ankle);
    if(a>maxKneeAngle){ maxKneeAngle=a; peakExtIdx=i; }
  });

  // kick height relative to hip baseline
  const baseFootY = frames[0][side].foot.y;
  const minFootY = Math.min(...jd.foot.y);
  const kickHeightPx = baseFootY - minFootY;
  const peakIdx = jd.foot.y.indexOf(minFootY);

  visibleJoints = { hip:true, knee:true, ankle:true, foot:true };
  lastResultData = { jd, ts, side, peakIdx, peakExtIdx, maxKneeAngle };
  renderJointLegend();
  drawDiagram();

  const stats = [
    { v:(totalMs/1000).toFixed(2), u:'s', l:'משך הבעיטה' },
    { v:Math.round(peakSpeed), u:'px/s', l:'מהירות שיא (כף הרגל)' },
    { v:Math.round(maxKneeAngle)+'°', u:'', l:'זווית ברך מקסימלית' },
    { v:Math.round(kickHeightPx), u:'px', l:'גובה הבעיטה' },
    { v:(kickHeightPx/unitPx).toFixed(2), u:'× רגל', l:'גובה יחסי לאורך הרגל' },
    { v:(peakSpeed/unitPx).toFixed(2), u:'× רגל/s', l:'מהירות יחסית' },
  ];
  document.getElementById('stats').innerHTML = stats.map(st=>`
    <div class="stat">
      <div><span class="v mono">${st.v}</span><span class="u mono">${st.u}</span></div>
      <div class="l">${st.l}</div>
    </div>`).join('');

  document.getElementById('norm').textContent =
    'המדידות מבוססות פיקסלים מהמצלמה (לא ס״מ). "יחסי לאורך הרגל" משתמש באורך הרגל התומכת שלכם כיחידת מידה, כדי לאפשר השוואה גסה בין בעיטות גם אם המרחק מהמצלמה משתנה מעט. הרשת מיושרת ל-0°/90° דרך נקודת האגן ההתחלתית; הנקודות על כל קו מסמנות פרקי זמן שווים לאורך התנועה.';
}

// Single static diagram: every joint's full path in its own color, on a 90°-aligned
// grid anchored at the starting hip position, with time-interval tick markers, plus
// two black stick-figure snapshots (start pose, full-extension peak pose).
function drawDiagram(){
  if(!lastResultData) return;
  const { jd, ts, side, peakIdx, peakExtIdx, maxKneeAngle } = lastResultData;
  const canvas = document.getElementById('trajCanvas');
  const wrapW = document.getElementById('trajWrap').clientWidth - 32;
  const aspect = 1.05;
  const W = wrapW, H = wrapW*aspect;
  canvas.width = W*2; canvas.height = H*2;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(2,2);
  ctx.clearRect(0,0,W,H);

  // fit ALL joints' full paths into the canvas (fixed regardless of toggles, so the view doesn't jump)
  const allX = [].concat(jd.hip.x, jd.knee.x, jd.ankle.x, jd.foot.x);
  const allY = [].concat(jd.hip.y, jd.knee.y, jd.ankle.y, jd.foot.y);
  const minX=Math.min(...allX), maxX=Math.max(...allX);
  const minY=Math.min(...allY), maxY=Math.max(...allY);
  const pad = 32;
  const sx = (W-2*pad)/((maxX-minX)||1);
  const sy = (H-2*pad)/((maxY-minY)||1);
  const s = Math.min(sx,sy);
  const ox = pad + (W-2*pad - (maxX-minX)*s)/2 - minX*s;
  const oy = pad + (H-2*pad - (maxY-minY)*s)/2 - minY*s;
  const mapPt = (x,y)=>({x:x*s+ox, y:y*s+oy});

  // --- 90° reference grid ---
  const step = 28;
  ctx.strokeStyle = 'rgba(18,18,18,0.055)';
  ctx.lineWidth = 1;
  for(let x=0; x<=W; x+=step){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=0; y<=H; y+=step){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  // --- 0°/90° crosshair through the starting hip position ---
  const origin = mapPt(jd.hip.x[0], jd.hip.y[0]);
  ctx.save();
  ctx.strokeStyle = 'rgba(18,18,18,0.22)';
  ctx.setLineDash([1,4]);
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(0,origin.y); ctx.lineTo(W,origin.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(origin.x,0); ctx.lineTo(origin.x,H); ctx.stroke();
  ctx.restore();

  // --- joint paths, each in its own color, with time-interval tick dots (only visible joints) ---
  const tickEveryMs = 150;
  JOINT_ORDER.forEach(joint=>{
    if(!visibleJoints[joint]) return;
    const xs = jd[joint].x, ys = jd[joint].y;
    ctx.strokeStyle = JOINT_COLORS[joint];
    ctx.lineWidth = joint==='hip' ? 2 : 2.6;
    ctx.lineCap = 'round'; ctx.lineJoin='round';
    ctx.globalAlpha = joint==='hip' ? 0.6 : 0.9;
    ctx.beginPath();
    xs.forEach((x,i)=>{ const p=mapPt(x,ys[i]); i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y); });
    ctx.stroke();
    ctx.globalAlpha = 1;

    // time tick dots
    let nextTick = 0;
    for(let i=0;i<xs.length;i++){
      if(ts[i] >= nextTick){
        const p = mapPt(xs[i], ys[i]);
        ctx.fillStyle = JOINT_COLORS[joint];
        ctx.beginPath(); ctx.arc(p.x,p.y, joint==='hip'?1.6:2.2, 0, 7); ctx.fill();
        nextTick += tickEveryMs;
      }
    }
  });

  // --- black stick-figure snapshots: start pose (outline) + full-extension peak pose (solid) ---
  function drawSnapshot(idx, solid){
    const chain = JOINT_ORDER.filter(j=>visibleJoints[j]);
    ctx.save();
    ctx.strokeStyle = solid ? '#121212' : 'rgba(18,18,18,0.55)';
    ctx.lineWidth = solid ? 2.2 : 1.4;
    if(!solid) ctx.setLineDash([3,3]);
    ctx.beginPath();
    chain.forEach((j,i)=>{
      const p = mapPt(jd[j].x[idx], jd[j].y[idx]);
      i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y);
    });
    ctx.stroke();
    ctx.restore();
    chain.forEach(j=>{
      const p = mapPt(jd[j].x[idx], jd[j].y[idx]);
      ctx.beginPath(); ctx.arc(p.x,p.y, solid?6:5, 0, 7);
      if(solid){ ctx.fillStyle='#121212'; ctx.fill(); }
      else{ ctx.strokeStyle='rgba(18,18,18,0.7)'; ctx.lineWidth=1.6; ctx.stroke(); }
    });
  }
  drawSnapshot(0, false);        // start of movement — hollow outline
  drawSnapshot(peakExtIdx, true); // full extension / peak of kick — solid black

  // labels for the two snapshots, anchored at each pose's hip point
  ctx.font = "600 11px 'JetBrains Mono', monospace";
  const startHip = mapPt(jd.hip.x[0], jd.hip.y[0]);
  ctx.fillStyle = 'rgba(18,18,18,0.7)';
  ctx.textAlign = startHip.x > W/2 ? 'right' : 'left';
  ctx.fillText('התחלה', startHip.x + (startHip.x>W/2?-10:10), startHip.y - 10);

  const peakHip = mapPt(jd.hip.x[peakExtIdx], jd.hip.y[peakExtIdx]);
  ctx.fillStyle = '#121212';
  ctx.textAlign = peakHip.x > W/2 ? 'right' : 'left';
  ctx.fillText('שיא — '+Math.round(maxKneeAngle)+'° בברך', peakHip.x + (peakHip.x>W/2?-10:10), peakHip.y - 10);
}

function renderJointLegend(){
  const el = document.getElementById('jointLegend');
  el.innerHTML = JOINT_ORDER.map(j=>`
    <button class="jointChip ${visibleJoints[j] ? '' : 'off'}" data-joint="${j}" style="border-color:${JOINT_COLORS[j]}55;">
      <span class="dot" style="background:${JOINT_COLORS[j]};"></span>${JOINT_LABELS[j]}
    </button>`).join('');
  el.querySelectorAll('.jointChip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const j = btn.dataset.joint;
      visibleJoints[j] = !visibleJoints[j];
      btn.classList.toggle('off', !visibleJoints[j]);
      drawDiagram();
    });
  });
}

document.getElementById('closeResults').addEventListener('click', resetToCalibrate);
document.getElementById('retryBtn').addEventListener('click', resetToCalibrate);

function resetToCalibrate(){
  document.getElementById('results').classList.remove('show');
  phase = 'calibrate';
  stableSince = null;
  stabilityBuffer = [];
  setState('כיול');
  hintEl.style.display='';
}

// ---------- Main detection loop ----------
async function detectLoop(){
  if(!running) return;
  if(video.readyState >= 2 && poseLandmarker){
    resizeCanvas();
    const w = overlay.width, h = overlay.height;
    const now = performance.now();
    const result = poseLandmarker.detectForVideo(video, now);
    if(result.landmarks && result.landmarks.length){
      const lm = result.landmarks[0];

      const mirrored = facingMode === 'user';
      if(phase==='calibrate'){
        const cal = evaluateCalibration(lm, w, h);
        drawSkeleton(lm, w, h, cal.ok, mirrored);
        hintEl.textContent = cal.msg;
        hintEl.classList.toggle('good', cal.ok);
        onCalibrationTick(cal.ok);
      } else if(phase==='countdown'){
        drawSkeleton(lm, w, h, true, mirrored);
      } else if(phase==='recording'){
        drawSkeleton(lm, w, h, true, mirrored);
        recordFrame(lm, w, h);
      } else {
        drawSkeleton(lm, w, h, false, mirrored);
      }
    } else {
      octx.clearRect(0,0,w,h);
      if(phase==='calibrate'){
        hintEl.textContent = 'לא רואה אתכם — היכנסו לפריים';
        hintEl.classList.remove('good');
      }
    }
  }
  requestAnimationFrame(detectLoop);
}

// ---------- Startup ----------
async function acquireCamera(mode){
  return navigator.mediaDevices.getUserMedia({
    video:{ facingMode:{ideal:mode}, width:{ideal:1280}, height:{ideal:720} },
    audio:false // mic is handled separately by SpeechRecognition — sharing the track can block voice-stop on some devices
  });
}

function attachStream(stream, mode){
  currentStream = stream;
  video.srcObject = stream;
  video.muted = true;
  video.playsInline = true;
  video.classList.toggle('mirrored', mode === 'user');
}

async function openCamera(mode){
  camError.classList.remove('show');
  // Most phones only allow one active camera stream at a time, so release the
  // current one before requesting the next — otherwise the new request just fails.
  if(currentStream){
    currentStream.getTracks().forEach(t=>t.stop());
    currentStream = null;
  }
  let stream;
  try{
    stream = await acquireCamera(mode);
  }catch(e){
    showCamError('לא ניתן לגשת למצלמה: ' + (e.message || e.name || 'שגיאה לא ידועה'));
    throw e;
  }
  attachStream(stream, mode);

  await new Promise((res)=>{
    if(video.readyState >= 1) return res();
    video.onloadedmetadata = res;
  });

  try{
    await video.play();
  }catch(e){
    // Autoplay blocked — surface a tap-to-play fallback instead of a silent black screen
    showCamError('הדפדפן חוסם הפעלה אוטומטית של הווידאו. הקישו למטה כדי להפעיל.', true);
  }

  resizeCanvas();

  // verify frames are actually arriving; if not, surface an error rather than staying black
  await new Promise(r=>setTimeout(r, 700));
  if(video.videoWidth === 0 || video.videoHeight === 0){
    showCamError('התקבלה הרשאה אך לא מתקבלת תמונה מהמצלמה. נסו לרענן, או להחליף דפדפן (מומלץ Chrome).');
  }
}

function showCamError(msg, tapOnly){
  camErrorMsg.textContent = msg;
  camError.classList.add('show');
  tapToPlay.style.display = tapOnly ? '' : 'none';
  if(!tapOnly){
    tapToPlay.style.display = '';
    tapToPlay.textContent = 'נסה שוב';
  } else {
    tapToPlay.textContent = 'הקש להפעלה';
  }
}

tapToPlay.addEventListener('click', async ()=>{
  camError.classList.remove('show');
  try{
    await video.play();
    resizeCanvas();
  }catch(e){
    try{ await openCamera(facingMode); }catch(_){}
  }
});

async function init(mode){
  facingMode = mode;
  await openCamera(mode);

  if(!poseLandmarker){
    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );
    poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
      baseOptions:{
        modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
        delegate:"GPU"
      },
      runningMode:"VIDEO",
      numPoses:1
    });
  }

  running = true;
  phase = 'calibrate';
  setState('כיול');
  requestAnimationFrame(detectLoop);
}

async function startWith(mode){
  permOverlay.style.display='none';
  try{
    await init(mode);
  }catch(e){
    if(camError.classList.contains('show')) return; // in-stage error banner already explains it
    permOverlay.style.display='flex';
    permOverlay.innerHTML = `<h1>שגיאה</h1><p>${e.message || 'לא ניתן לגשת למצלמה/מיקרופון'}</p>`;
  }
}

startBtn.addEventListener('click', ()=> startWith('environment'));

camSwitch.addEventListener('click', async ()=>{
  if(phase==='recording' || phase==='countdown') return; // don't allow mid-kick
  camSwitch.disabled = true;
  const previous = facingMode;
  const next = facingMode === 'user' ? 'environment' : 'user';
  try{
    await openCamera(next);
    facingMode = next; // only commit once the switch actually succeeded
    stableSince = null; stabilityBuffer = [];
  }catch(e){
    // the requested camera failed (e.g. no front camera on this device) — fall back
    // to reopening the previous one automatically instead of leaving the screen dead
    try{
      await openCamera(previous);
      facingMode = previous;
      camError.classList.remove('show');
      toast('למכשיר הזה אין ' + (next==='user' ? 'מצלמה קדמית' : 'מצלמה אחורית') + ' זמינה');
      stableSince = null; stabilityBuffer = [];
    }catch(e2){
      // both failed — the error panel from openCamera(previous) already explains it
    }
  }
  camSwitch.disabled = false;
});

function updateCamSwitchVisibility(){
  camSwitch.classList.toggle('hidden', phase==='recording' || phase==='countdown');
}
</script>
